# yaml config for training deep models
dataset:
  train: ./shoe_dataset/train
  val: ./shoe_dataset/val
  test: ./shoe_dataset/test
  bg_train: ./shoe_dataset/bg/train
  bg_val: ./shoe_dataset/bg/val

training:
  batch_size: 16
  num_epoch: 100
  optimizer: adam
  lr: 0.001
  l2reg: 0.00001
  aug_prob: 0.5
  imsize: 256
